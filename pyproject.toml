[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paco-observability"
version = "1.0.0"
description = "Parametric Assessment of Cooperative Observability"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Bo Shang"},
  {name = "Yiqiao Li"}
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<22"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["scripts/generate_methodology_figure.py"]

[tool.ruff.lint]
# Keep CI focused on syntax and undefined-name failures. The released analysis
# scripts preserve manuscript-era plotting style, which is intentionally not
# reformatted as part of the archival package.
select = ["E9", "F63", "F7", "F82"]
